name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug dist contents
        run: |
          echo "=== dist root ==="
          ls -la dist/
          echo "=== dist/videos ==="
          ls -la dist/videos/ 2>/dev/null || echo "videos not found"
          echo "=== dist/photograph ==="
          ls -la dist/photograph/ 2>/dev/null || echo "photograph not found"
          echo "=== dist/assets ==="
          ls -la dist/assets/ 2>/dev/null || echo "assets not found"
          echo "=== public dir ==="
          ls -la public/ 2>/dev/null || echo "public not found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
